name: Build Windows Executable

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          arch: 'win64_msvc2019_64'

      - name: Show Qt environment (debug)
        shell: cmd
        run: |
          echo QT_ROOT_DIR=%QT_ROOT_DIR%
          where qmake
          where windeployqt

      - name: Configure (CMake)
        shell: cmd
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="%QT_ROOT_DIR%"

      - name: Build (Release)
        shell: cmd
        run: cmake --build build --config Release --parallel

      - name: Deploy Qt runtime (windeployqt)
        shell: cmd
        run: |
          mkdir dist
          copy build\Release\FFmpegAudioEditor.exe dist\
          windeployqt.exe --release --no-translations --dir dist dist\FFmpegAudioEditor.exe

      - name: Upload distributable folder
        uses: actions/upload-artifact@v4
        with:
          name: FFmpegAudioEditor-windows
          path: dist/
